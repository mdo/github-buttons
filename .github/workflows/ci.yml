name: CI

on:
  push:
    branches-ignore:
      - "dependabot/**"
    tags:
      - "*"
  pull_request:
  workflow_dispatch:

permissions: {}

env:
  FORCE_COLOR: 2
  NODE: 24
  RUBY: "3.4"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE }}
          # no cache on tags since that build gets deployed
          cache: ${{ !startsWith(github.ref, 'refs/tags/') && 'npm' || '' }} # zizmor: ignore[cache-poisoning]
          package-manager-cache: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: ${{ env.RUBY }}
          bundler-cache: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: Install gems
        if: startsWith(github.ref, 'refs/tags/')
        run: bundle install

      - name: Install npm dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Upload docs
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.repository == 'mdo/github-buttons' && startsWith(github.ref, 'refs/tags/')
        with:
          path: ./_site/

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.repository == 'mdo/github-buttons' && startsWith(github.ref, 'refs/tags/')
    timeout-minutes: 20
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
